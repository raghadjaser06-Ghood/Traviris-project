<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravIris | Login</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <!-- ========== Header ========== -->
  <header class="header">
    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="TravIris logo">
    </a>

    <nav class="navbar">
      <a href="index.html">Home</a>
      <a href="index.html#categories">Explore</a>
      <a href="planning.html">Planning</a>
      <a href="about.html">About</a>
    </nav>

    <a href="profile.html" class="user">
      <img src="images/avatar.png" alt="Profile">
    </a>
  </header>

  <main class="login-page">

    <!-- ========== Login form ========== -->
    <form class="login-box" id="loginForm">
      <img src="images/logo-icon.png" alt="TravIris" class="login-logo">
      <h1>Welcome Back</h1>
      <p class="login-sub">Log in to see your trips and favorites.</p>

      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="name@gmail.com" required>

      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="******" required>

      <a href="#" class="forgot" id="forgotPassword">Forgot password?</a>

      <button type="submit" class="login-btn" id="loginBtn">Log In</button>

      <!-- messages (errors / success) show here -->
      <p class="status" id="loginStatus" role="status" aria-live="polite"></p>

      <p class="switch">Don't have an account? <a href="#" id="showSignup">Sign up</a></p>
    </form>

    <!-- ========== Sign up form (hidden at first) ========== -->
    <form class="login-box" id="signupForm" style="display: none;">
      <img src="images/logo-icon.png" alt="TravIris" class="login-logo">
      <h1>Create Account</h1>
      <p class="login-sub">Start planning your Jordan trip.</p>

      <div class="two-inputs">
        <div>
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" placeholder="First Name" required>
        </div>
        <div>
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" placeholder="Last Name" required>
        </div>
      </div>

      <label for="signupEmail">Email</label>
      <input type="email" id="signupEmail" placeholder="name@gmail.com" required>

      <label for="signupPassword">Password</label>
      <input type="password" id="signupPassword" placeholder="At least 6 characters" required>

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Write the password again" required>

      <button type="submit" class="login-btn" id="signupBtn">Sign Up</button>

      <!-- messages (errors / success) show here -->
      <p class="status" id="signupStatus" role="status" aria-live="polite"></p>

      <p class="switch">Already have an account? <a href="#" id="showLogin">Log in</a></p>
    </form>

  </main>

  <!-- ========== Footer ========== -->
  <footer class="footer">
    <div class="footer-logo">
      <img src="images/logo-icon.png" alt="TravIris logo">
      <span>TravIris</span>
    </div>
    <hr>
  </footer>

  <!-- type="module" because it uses Firebase (import) -->
  <script type="module" src="login.js"></script>
</body>
</html>
