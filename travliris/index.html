<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravIris | Home</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== Header ========== -->
  <header class="header">
    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="TravIris logo">
    </a>

    <nav class="navbar">
      <a href="index.html" class="active">Home</a>
      <a href="index.html#categories">Explore</a>
      <a href="planning.html">Planning</a>

  <!-- ========== Hero ========== -->
  <section class="hero">
    <h1 class="hero-title">
      <span>J</span><span>O</span><span>R</span><span>D</span><span>A</span><span>N</span>
    </h1>

    <div class="hero-buttons">
      <a href="#categories" class="btn btn-fill">Explore Hidden Jordan</a>
      <a href="planning.html" class="btn btn-outline">Build My Route</a>
    </div>

    <img src="images/rock.png" alt="Wadi Rum rocks" class="hero-rock">

  <section class="categories" id="categories">
    <h2 class="reveal">What Are You In The Mood For?</h2>
    <p class="reveal">Choose a vibe and let us suggest the best place for you</p>

    <div class="cards reveal">

      </a>

      <a href="desert.html" class="card">

        <h3>Mountains &amp; Desert</h3>
      </a>

      <a href="forest.html" class="card card-low">
        <img src="images/cat-forest.jpg" alt="Forests and Nature">
        <h3>Forests &amp; Nature</h3>
      </a>

      <a href="history.html" class="card">
        <img src="images/cat-history.jpg" alt="History and Heritage">
        <h3>History &amp; Heritage</h3>
      </a>
    </div>
  </section>

  <!-- ========== Footer ========== -->
  <footer class="footer">
    <div class="footer-logo reveal">
      <img src="images/logo-icon.png" alt="TravIris logo">
      <span>TravIris</span>
    </div>

    <hr>

    <div class="social reveal">
      <span>follow us on</span>
      <a href="#" class="twitter"><i class="fa-brands fa-twitter"></i></a>
      <a href="#" class="facebook"><i class="fa-brands fa-facebook"></i></a>
      <a href="#" class="instagram"><i class="fa-brands fa-instagram"></i></a>
